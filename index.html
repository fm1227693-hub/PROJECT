<!doctype html>
<html lang="uz" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Optimum School of English - Ingliz tilini noldan mukammallikkacha o'rganing. Professional o'qituvchilar va intensiv kurslar." />
    <meta name="theme-color" content="#C82032" />
    <title>Optimum ELC — Premium English Learning Center | CDI & IELTS Preparation</title>
    
    <!-- Open Graph / Social Media Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://optimumelc.uz/" />
    <meta property="og:title" content="Optimum ELC — Premium English Learning Center" />
    <meta property="og:description" content="Ingliz tilini noldan mukammallikkacha o'rganing. CDI mock simulatori, IELTS 7.5+ tayyorgarlik va tajribali ustozlar." />
    <meta property="og:image" content="https://optimumelc.uz/favicon.png" />

    <!-- Structured Data (Schema.org) for Educational Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "OPTIMUM ELC",
      "alternateName": "Optimum English Learning Center",
      "url": "https://optimumelc.uz/",
      "logo": "https://optimumelc.uz/favicon.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Namozgoh St",
        "addressLocality": "Bukhara",
        "addressCountry": "UZ"
      },
      "telephone": "+998900829979"
    }
    </script>
    
    <!-- Dark mode FOUC oldini olish: React yuklanishidan oldin tema qo'llanadi -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === null || saved === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>


    <!-- Modern High-Legibility Typography with swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F5F0] dark:bg-[#070911] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
