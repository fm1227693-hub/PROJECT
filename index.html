<!doctype html>
<html lang="uz" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Optimum School of English - Ingliz tilini noldan mukammallikkacha o'rganing. Professional o'qituvchilar va intensiv kurslar." />
    <meta name="theme-color" content="#0e0c0b" />
    <title>Optimum School of English — Premium Language Learning</title>

    <!-- Dark mode FOUC oldini olish: React yuklanishidan oldin tema qo'llanadi -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        // Saqlangan qiymat yo'q bo'lsa yoki 'true' bo'lsa — dark mode
        if (saved === null || saved === 'true') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Typography: Cormorant Garamond (display serif) + Manrope (UI grotesque) — both with Cyrillic support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
