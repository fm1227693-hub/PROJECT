<!doctype html>
<html lang="uz" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="OptimumELC — Premier English & IELTS Academy. Computer-delivered mock exams, AI writing assessment, intensive speaking clubs, and verified 8.5+ band mentors in Bukhara." />
    <meta name="theme-color" content="#090a0f" />
    <title>OptimumELC — Premier English & IELTS Academy</title>
    
    <!-- Dark mode FOUC prevention -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === null || saved === 'true' || saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Google Fonts Preconnect & Modern Typefaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
